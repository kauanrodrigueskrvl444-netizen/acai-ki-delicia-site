name: Deploy to GitHub Pages

# Antes desse workflow existir, publicar em gh-pages era um passo manual
# separado do "git push master" — e ficou esquecido por dias (29/07 até
# 01/08) sem ninguém perceber que a URL oficial estava travada numa versão
# antiga enquanto master seguia recebendo commits normalmente. Isso fecha
# esse buraco: todo push em master que muda algo em public/ publica sozinho.

on:
  push:
    branches: [master]
    paths: ["public/**"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publica public/ na branch gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
