<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Este endereço foi a URL oficial da loja até 25/08/2026, quando o site
       passou pro domínio próprio acaikideliciaperus.com.br, servido pelo
       Cloudflare Workers.

       A branch não publica mais o site: publica só este redirecionamento, e o
       workflow que a republicava foi removido do master. Duas razões pra ele
       existir em vez de a branch ser apagada. A primeira é quem tem o endereço
       antigo salvo ou publicado em algum lugar: apagar deixaria essa pessoa
       num 404 sem saída. A segunda é o Google, que precisa entender que o
       conteúdo mudou de lugar pra transferir o que já tinha indexado — um 404
       seco perde isso.

       O GitHub Pages não permite responder cabeçalho HTTP, então não existe
       301 de verdade aqui. Refresh instantâneo mais canonical é o mais próximo
       disponível, e o Google trata como redirecionamento quando o tempo é
       zero. O noindex tira esta página do índice sem impedir que o rastreador
       siga o destino. -->
  <meta http-equiv="refresh" content="0; url=https://acaikideliciaperus.com.br/">
  <link rel="canonical" href="https://acaikideliciaperus.com.br/">
  <meta name="robots" content="noindex, follow">

  <title>Açaí Kidelicia mudou de endereço</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3a0d3f;
      color: #fdf6f0;
      font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .caixa { max-width: 30rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 12px; line-height: 1.3; }
    p { color: rgba(253, 246, 240, 0.78); margin: 0 0 24px; line-height: 1.6; }
    a {
      display: inline-block;
      background: #fbbf24;
      color: #3a0d3f;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 999px;
      box-shadow: 0 8px 24px -10px rgba(251, 191, 36, 0.9);
    }
    a:hover { background: #ffd15c; }
  </style>
</head>
<body>
  <div class="caixa">
    <h1>A Açaí Kidelicia mudou de endereço</h1>
    <p>Agora é acaikideliciaperus.com.br. Se a página não abrir sozinha, é só tocar no botão.</p>
    <a href="https://acaikideliciaperus.com.br/">Ir para o site</a>
  </div>
</body>
</html>
